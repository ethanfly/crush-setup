<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crush Setup</title>
    <link rel="icon" type="image/png" href="icon.png" sizes="256x256" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#list" data-i18n="a11y.skip">Skip to content</a>
    <div id="app">
      <header class="titlebar">
        <div class="titlebar-drag">
          <img class="mark sm" src="icon.png" alt="" />
          <span class="titlebar-name">Crush Setup</span>
        </div>
        <div class="titlebar-right">
          <div class="lang-switch" role="group" data-i18n-aria="lang.label" aria-label="Language">
            <button type="button" class="lang-btn" data-lang="auto" data-i18n="lang.auto">Auto</button>
            <button type="button" class="lang-btn" data-lang="zh" data-i18n="lang.zh">中文</button>
            <button type="button" class="lang-btn" data-lang="en" data-i18n="lang.en">English</button>
          </div>
          <div class="win-controls" hidden>
            <button type="button" id="winMin" class="win-btn" data-i18n-aria="win.min" aria-label="Minimize">
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
            </button>
            <button type="button" id="winMax" class="win-btn" data-i18n-aria="win.max" aria-label="Maximize">
              <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.4" y="2.4" width="7.2" height="7.2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
            </button>
            <button type="button" id="winClose" class="win-btn close" data-i18n-aria="win.close" aria-label="Close">
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3L3 9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
            </button>
          </div>
        </div>
      </header>

      <div class="shell">
        <aside class="nav" id="navigator">
          <div class="brand">
            <img class="mark" src="icon.png" alt="" />
            <div>
              <div class="brand-name">Crush Setup</div>
              <div class="brand-sub" data-i18n="brand.sub">config manager</div>
            </div>
          </div>
          <nav class="nav-list" data-i18n-aria="nav.aria" aria-label="Sections">
            <button class="nav-item active" data-section="models">
              <svg class="nav-ico" viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="5" height="5" fill="currentColor"/><rect x="8" y="1" width="5" height="5" fill="currentColor"/><rect x="1" y="8" width="5" height="5" fill="currentColor"/><rect x="8" y="8" width="5" height="5" fill="currentColor"/></svg>
              <span data-i18n="nav.models">Models</span>
            </button>
            <button class="nav-item" data-section="skills">
              <svg class="nav-ico" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 12V4h3V2h4v2h3v8H2zm3-8h4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
              <span data-i18n="nav.skills">Skills</span>
            </button>
            <button class="nav-item" data-section="mcp">
              <svg class="nav-ico" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h4M8 7h4M6 4v6M8 4v6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
              <span data-i18n="nav.mcp">MCP</span>
            </button>
            <button class="nav-item" data-section="lsp">
              <svg class="nav-ico" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 11l4-8 4 8M5 8h4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
              <span data-i18n="nav.lsp">LSP</span>
            </button>
            <button class="nav-item" data-section="hooks">
              <svg class="nav-ico" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3h8v3H7v5H3V3z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
              <span data-i18n="nav.hooks">Hooks</span>
            </button>
            <button class="nav-item" data-section="permissions">
              <svg class="nav-ico" viewBox="0 0 14 14" aria-hidden="true"><path d="M4 6V4a3 3 0 016 0v2M3 6h8v7H3V6z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
              <span data-i18n="nav.permissions">Permissions</span>
            </button>
            <button class="nav-item" data-section="options">
              <svg class="nav-ico" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 7h4M7 5v4" stroke="currentColor" stroke-width="1.4"/></svg>
              <span data-i18n="nav.options">Options</span>
            </button>
            <button class="nav-item" data-section="env">
              <svg class="nav-ico" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 3h10v8H2V3zm0 3h10" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
              <span data-i18n="nav.env">Env &amp; tools</span>
            </button>
          </nav>
          <div class="nav-slots" id="modelSlots">
            <div class="nav-slots-title" data-i18n="slots.title">Current models</div>
            <div id="slotLarge" class="nav-slot"></div>
            <div id="slotSmall" class="nav-slot"></div>
          </div>
          <div class="crush-agent" id="crushAgent"></div>
          <div class="nav-foot">
            <span class="dot"></span>
            <span data-i18n="nav.foot">auto-saves crush.json / crushrc</span>
          </div>
        </aside>

        <main class="workspace">
          <header class="topbar">
            <div class="scopes" role="tablist">
              <button class="scope active" data-scope="global" data-i18n="scope.global">Global</button>
              <button class="scope" data-scope="project" data-i18n="scope.project">Project</button>
            </div>
            <div class="project-path">
              <input id="projectDir" type="text" data-i18n-placeholder="project.placeholder" placeholder="Project directory" spellcheck="false" autocomplete="off" />
              <button type="button" id="browseProject" class="ghost" data-i18n="btn.browse">Browse</button>
            </div>
            <div class="actions">
              <button type="button" id="reloadBtn" class="ghost" data-i18n="btn.reload">Reload</button>
              <button type="button" id="saveBtn" class="ghost" data-i18n="btn.save" data-i18n-title="hint.autosave" title="Changes save automatically">Save</button>
            </div>
          </header>
          <div id="status" class="status" hidden></div>
          <div id="fileHint" class="file-hint" hidden></div>
          <section class="body">
            <div class="list-pane">
              <div class="list-head">
                <h1 id="sectionTitle">Models</h1>
                <button type="button" id="addBtn" class="primary small">Add</button>
              </div>
              <div id="list" class="card-list"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="modalOverlay" class="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <i class="px tl" aria-hidden="true"></i>
        <i class="px tr" aria-hidden="true"></i>
        <i class="px bl" aria-hidden="true"></i>
        <i class="px br" aria-hidden="true"></i>
        <header class="modal-head">
          <h2 id="modalTitle"></h2>
          <button type="button" id="modalClose" class="modal-close" data-i18n-aria="btn.close" aria-label="Close">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3L3 9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
        </header>
        <form id="form" class="form" novalidate></form>
      </div>
    </div>

    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
